name: Deploy to EC2

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload application files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          source: "api,core,manage.py,requirements.txt,Dockerfile,docker-compose.yml,entrypoint.sh,nginx.conf,generate-ssl.sh,monitor.sh,sample_env"
          target: ${{ secrets.EC2_APP_DIR != '' && secrets.EC2_APP_DIR || '/opt/discount-ecommerce-api' }}
          overwrite: true

      - name: Deploy with Docker Compose on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -eu

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/discount-ecommerce-api"
            fi

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -z "${{ secrets.PROD_ENV_FILE }}" ]; then
              echo "ERROR: PROD_ENV_FILE secret is required."
              exit 1
            fi

            cat > .env <<'ENVFILE'
            ${{ secrets.PROD_ENV_FILE }}
            ENVFILE

            # CI/CD controls runtime startup tasks to avoid duplicate work after
            # explicit deploy-time initialization below.
            printf "\nRUN_MIGRATIONS_ON_STARTUP=false\nRUN_COLLECTSTATIC_ON_STARTUP=false\n" >> .env
            chmod 600 .env

            chmod +x entrypoint.sh generate-ssl.sh monitor.sh || true

            compose() {
              if sudo docker compose version >/dev/null 2>&1; then
                sudo docker compose "$@"
              else
                sudo docker-compose "$@"
              fi
            }

            # Build first so one-off initialization uses the same image as runtime.
            compose build web

            # Start database only, then wait for readiness.
            compose up -d db
            DB_READY_RETRIES=30
            until compose exec -T db pg_isready -U "${POSTGRES_USER:-elikem_user}" -d "${POSTGRES_DB:-elikem_db}" >/dev/null 2>&1; do
              DB_READY_RETRIES=$((DB_READY_RETRIES-1))
              if [ "$DB_READY_RETRIES" -le 0 ]; then
                echo "ERROR: database did not become ready in time."
                exit 1
              fi
              sleep 2
            done

            # Explicit, idempotent database/application initialization.
            compose run --rm web python manage.py migrate --noinput
            compose run --rm web python manage.py collectstatic --noinput
            compose run --rm web python manage.py add_countries

            # Start full stack.
            compose up -d --remove-orphans
            compose ps

            sudo docker image prune -f
