name: Test and deploy to EC2

# Pull requests run the tests. Every push to master runs the tests and, if they
# pass and the EC2 secrets are configured, deploys the API. "Run workflow"
# deploys by hand.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys instead of cancelling one halfway through a migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///ci-test.sqlite3
      BASE_OTP_SECRET: JBSWY3DPEHPK3PXP
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      USE_S3: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r dev-requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider --create-db

  deploy:
    name: Deploy to production EC2
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::notice::EC2_HOST is not set, so the deploy is skipped. Add the EC2 secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Deploy application on EC2
        if: steps.secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT != '' && secrets.EC2_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -eu

            APP_DIR="${{ secrets.EC2_APP_DIR != '' && secrets.EC2_APP_DIR || '/opt/discount-ecommerce-api' }}"
            GIT_REPO="${{ secrets.EC2_GIT_REPO != '' && secrets.EC2_GIT_REPO || 'https://github.com/Slightly-Techie/discount-ecommerce-api.git' }}"
            GIT_BRANCH="${{ secrets.EC2_GIT_BRANCH != '' && secrets.EC2_GIT_BRANCH || 'master' }}"
            SSL_DOMAIN="${{ secrets.EC2_SSL_DOMAIN != '' && secrets.EC2_SSL_DOMAIN || 'api.grottomore.com' }}"
            SSL_EMAIL="${{ secrets.EC2_SSL_EMAIL != '' && secrets.EC2_SSL_EMAIL || 'admin@api.grottomore.com' }}"

            sudo dnf install -y git || true

            # The checkout belongs to the SSH user, so git runs as that user: root
            # git refuses a repo it doesn't own ("dubious ownership").
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$(id -u):$(id -g)" "$APP_DIR"
              git clone --branch "$GIT_BRANCH" "$GIT_REPO" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch --all --tags
              git -C "$APP_DIR" checkout "$GIT_BRANCH"
              git -C "$APP_DIR" pull --ff-only origin "$GIT_BRANCH"
            fi

            cd "$APP_DIR"
            sudo mkdir -p ssl

            if [ ! -f "ssl/live/$SSL_DOMAIN/fullchain.pem" ] || [ ! -f "ssl/live/$SSL_DOMAIN/privkey.pem" ]; then
              sudo chmod +x generate-ssl.sh
              sudo ./generate-ssl.sh "$SSL_DOMAIN" "$SSL_EMAIL"
            fi

            if [ ! -f "ssl/live/$SSL_DOMAIN/fullchain.pem" ] || [ ! -f "ssl/live/$SSL_DOMAIN/privkey.pem" ]; then
              echo "ERROR: SSL certificate generation failed for $SSL_DOMAIN."
              exit 1
            fi

            if [ ! -f "ssl/cert.pem" ] || [ ! -f "ssl/key.pem" ]; then
              sudo cp "ssl/live/$SSL_DOMAIN/fullchain.pem" ssl/cert.pem
              sudo cp "ssl/live/$SSL_DOMAIN/privkey.pem" ssl/key.pem
              sudo chmod 600 ssl/key.pem
              sudo chmod 644 ssl/cert.pem
            fi

            if [ -z "${{ secrets.PROD_ENV_FILE }}" ]; then
              echo "ERROR: PROD_ENV_FILE secret is required."
              exit 1
            fi

            cat > .env <<'ENVFILE'
            ${{ secrets.PROD_ENV_FILE }}
            ENVFILE

            printf "\nRUN_MIGRATIONS_ON_STARTUP=true\nRUN_COLLECTSTATIC_ON_STARTUP=false\n" >> .env
            sudo chmod 600 .env

            sudo chmod +x entrypoint.sh generate-ssl.sh monitor.sh || true

            compose() {
              if sudo docker compose version >/dev/null 2>&1; then
                sudo docker compose "$@"
              else
                sudo docker-compose "$@"
              fi
            }

            BOOTSTRAP_MARKER="$APP_DIR/.bootstrap-complete"
            if [ ! -f "$BOOTSTRAP_MARKER" ]; then
              compose up -d db

              DB_READY_RETRIES=30
              until compose exec -T db pg_isready -U "${POSTGRES_USER:-elikem_user}" -d "${POSTGRES_DB:-elikem_db}" >/dev/null 2>&1; do
                DB_READY_RETRIES=$((DB_READY_RETRIES-1))
                if [ "$DB_READY_RETRIES" -le 0 ]; then
                  echo "ERROR: database did not become ready in time."
                  exit 1
                fi
                sleep 2
              done

              compose run --rm web python manage.py migrate --noinput
              compose run --rm web python manage.py collectstatic --noinput
              compose run --rm web python manage.py add_countries

              touch "$BOOTSTRAP_MARKER"
            fi

            compose up -d --build --remove-orphans
            compose ps

            sudo docker image prune -f
